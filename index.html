<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://rjhfvorbgpdubnqfbexc.supabase.co; connect-src 'self' https://rjhfvorbgpdubnqfbexc.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Ringgit Log</title>
<meta name="description" content="Track daily and monthly expenses in Malaysia: TnG eWallet and CIMB statements, receipts, trips and toll, office and on-site parking, and Excel import.">
<meta name="theme-color" content="#f6f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121012" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
html,body{margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a fixed left rail and a scrolling workspace of cards on a faintly tinted plane; money is set in a receipt-style mono. */
:root{
  --plane:#f6f4f5; --surface:#ffffff; --surface-2:#fbf9fa; --sunken:#f1eef0;
  --line:#e7e2e5; --line-2:#d5ced2;
  --ink:#1d181b; --ink-2:#564d52; --ink-3:#72686e;
  --accent:#d32f3d; --accent-hover:#bd2634; --accent-ink:#ffffff; --accent-soft:#fdecee; --accent-text:#b3212e;
  --good:#17703a; --good-soft:#e5f4ea; --warn:#855800; --warn-soft:#fdf1d3; --bad:#b3212e; --bad-soft:#fdecee;
  --c-travel:#2a78d6; --c-food:#eb6834; --c-parking:#1baf7a; --c-shopping:#eda100; --c-bills:#e87ba4; --c-other:#898781;
  --grid:#ece8ea; --axis:#cdc5c9; --focus:#2a78d6;
  --hw:#0f6b4f; --hw-soft:#e2f3ec;
  --shadow:0 1px 2px rgba(29,24,27,.06);
  --shadow-pop:0 14px 36px rgba(29,24,27,.18), 0 2px 6px rgba(29,24,27,.08);
  --overlay:rgba(29,24,27,.46);
  --font-ui:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num:"DM Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#121012; --surface:#1b171a; --surface-2:#171416; --sunken:#262125;
    --line:#2e282c; --line-2:#433b40;
    --ink:#f2edf0; --ink-2:#c4bac0; --ink-3:#978c92;
    --accent:#d32f3d; --accent-hover:#bf2a37; --accent-ink:#ffffff; --accent-soft:#3a181d; --accent-text:#ff9097;
    --good:#63d08f; --good-soft:#12301f; --warn:#f0c058; --warn-soft:#382b0b; --bad:#ff9097; --bad-soft:#3a181d;
    --c-travel:#3987e5; --c-food:#d95926; --c-parking:#199e70; --c-shopping:#c98500; --c-bills:#d55181; --c-other:#898781;
    --grid:#2a2428; --axis:#433b40; --focus:#6aa5ee;
    --hw:#6fd3ae; --hw-soft:#12301f;
    --shadow:0 1px 2px rgba(0,0,0,.45);
    --shadow-pop:0 18px 44px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
    --overlay:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --plane:#121012; --surface:#1b171a; --surface-2:#171416; --sunken:#262125;
  --line:#2e282c; --line-2:#433b40;
  --ink:#f2edf0; --ink-2:#c4bac0; --ink-3:#978c92;
  --accent:#d32f3d; --accent-hover:#bf2a37; --accent-ink:#ffffff; --accent-soft:#3a181d; --accent-text:#ff9097;
  --good:#63d08f; --good-soft:#12301f; --warn:#f0c058; --warn-soft:#382b0b; --bad:#ff9097; --bad-soft:#3a181d;
  --c-travel:#3987e5; --c-food:#d95926; --c-parking:#199e70; --c-shopping:#c98500; --c-bills:#d55181; --c-other:#898781;
  --grid:#2a2428; --axis:#433b40; --focus:#6aa5ee;
  --hw:#6fd3ae; --hw-soft:#12301f;
  --shadow:0 1px 2px rgba(0,0,0,.45);
  --shadow-pop:0 18px 44px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  --overlay:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{min-height:100%;display:flex;flex-direction:column;background:var(--plane);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,p,dl,dd{margin:0}
h1,h2,h3{text-wrap:balance}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ico{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.grow{flex:1;min-width:0}

/* ---------- boot ---------- */
.boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 16px;text-align:center;color:var(--ink-2)}
.boot strong{font-size:18px;color:var(--ink)}

/* ---------- shell ---------- */
.app{flex:1;display:grid;grid-template-columns:244px minmax(0,1fr);min-width:0}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:18px 12px 14px;background:var(--surface-2);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--ink-2);font-weight:500;width:100%}
.nav-item .ico{color:var(--ink-3)}
.nav-item:hover{background:var(--sunken);color:var(--ink)}
.nav-item.is-active{background:var(--sunken);color:var(--ink);font-weight:700}
.nav-item.is-active .ico{color:var(--accent-text)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
.sync{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.35;color:var(--ink-3);padding:0 8px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none;margin-top:4px}
.sync.is-cloud .sync-dot{background:var(--good)}
.sync.is-local .sync-dot{background:var(--warn)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 28px;background:var(--plane);border-bottom:1px solid var(--line)}
.top-title{min-width:0}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.eyebrow{font-size:12px;color:var(--ink-3);font-weight:500}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.content{padding:22px 28px 48px;display:flex;flex-direction:column;gap:16px;width:100%;max-width:1320px}
.icon-btn.only-mobile{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunken);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px;gap:6px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.linkish{color:var(--accent-text);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.month{display:inline-flex;align-items:center;height:38px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
.month button{width:34px;height:36px;display:grid;place-items:center;color:var(--ink-2);border-radius:9px}
.month button:hover{background:var(--sunken);color:var(--ink)}
.month-label{min-width:112px;text-align:center;font-weight:700;font-size:14px;padding:0 2px}
.seg{display:inline-flex;align-self:flex-start;padding:3px;background:var(--sunken);border-radius:10px;gap:2px;max-width:100%}
.seg button{min-height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip:hover{color:var(--ink)}
.chip.is-on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip-n{font-size:11px;color:var(--ink-3);font-weight:400}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.input,.select{min-height:38px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:0 10px;width:100%;min-width:0;color:var(--ink)}
.input::placeholder{color:var(--ink-3)}
.input:focus-visible,.select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
textarea.input{padding:8px 10px;resize:vertical;min-height:64px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .wide{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);flex:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card-head h2{font-size:16px;font-weight:700;letter-spacing:-.015em}
.card-sub{font-size:12px;color:var(--ink-3)}
.spacer{flex:1}
.card-body{padding:14px 18px 18px;min-width:0}
.card-foot{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink-3);line-height:1.5}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:34px 18px;color:var(--ink-2)}
.empty h3{font-size:16px;color:var(--ink)}
.empty p{max-width:46ch}
.empty-ico{width:44px;height:44px;border-radius:14px;background:var(--sunken);display:grid;place-items:center;color:var(--ink-2)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px dashed var(--line-2);background:var(--surface);font-size:13px;color:var(--ink-2)}
.banner strong{color:var(--ink)}
.banner .grow{flex:1 1 260px}
.banner.warn{background:var(--warn-soft);border-style:solid;border-color:transparent;color:var(--ink)}
.banner.bad{background:var(--bad-soft);border-style:solid;border-color:transparent;color:var(--ink)}
.banner .ico{color:var(--ink-3)}
.banner.warn .ico{color:var(--warn)}
.banner.bad .ico{color:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ex{border:1px dashed var(--line-2);background:transparent;color:var(--ink-3);font-weight:600}
.tag.good{background:var(--good-soft);color:var(--good)}
.rv-tags .tag{white-space:normal;max-width:100%;border-radius:10px;line-height:1.35;padding-block:3px}
.rv-tags .tag svg{flex:none}

/* ---------- overview ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat-label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);font-weight:600}
.stat-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-2);flex:none}
.stat-value{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.cur{font-size:.5em;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.stat-sub{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px}
.delta{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.delta.up{background:var(--bad-soft);color:var(--bad)}
.delta.down{background:var(--good-soft);color:var(--good)}
.delta.flat{background:var(--sunken);color:var(--ink-2)}
.split{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,2fr);gap:14px;align-items:stretch}
.split.even{grid-template-columns:minmax(0,3fr) minmax(280px,2fr)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}

/* ---------- charts ---------- */
.chart{position:relative;width:100%;border-radius:8px}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1;fill:none}
.chart .ax{stroke:var(--axis);stroke-width:1;fill:none}
.chart .tk{fill:var(--ink-3);font-family:var(--font-num);font-size:11px}
.chart .tk.is-sel{fill:var(--ink);font-weight:500}
.chart .band{fill:transparent}
.chart .band.is-act{fill:var(--sunken)}
.chart .band.is-sel{fill:var(--sunken)}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;pointer-events:none;text-align:center;padding:0 16px}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 10px;font-size:12px;min-width:136px;max-width:220px;box-shadow:var(--shadow-pop)}
.tip-title{font-weight:600;opacity:.82}
.tip-total{font-family:var(--font-num);font-size:15px;font-weight:500;margin:1px 0 5px}
.tip-row{display:flex;align-items:center;gap:7px}
.tip-row span{flex:1;opacity:.86}
.tip-row b{font-family:var(--font-num);font-weight:500}
.tip-key{width:10px;height:3px;border-radius:2px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);padding-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;width:176px;height:176px;flex:none;margin-inline:auto}
.donut svg{display:block}
.donut-ring{fill:none;stroke:var(--grid)}
.donut-seg{stroke:var(--surface);stroke-width:2;stroke-linejoin:round;cursor:default}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 34px}
.donut-center small{font-size:12px;color:var(--ink-3);font-weight:600}
.donut-center b{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.donut-center i{font-style:normal;font-size:12px;color:var(--ink-3)}
.donut-list{flex:1;min-width:200px;display:flex;flex-direction:column;gap:1px}
.dl-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 42px;gap:9px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px}
.dl-row.is-hot{background:var(--sunken)}
.dl-row .pct{text-align:right;color:var(--ink-3);font-size:12px}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl td.l,.tbl th.l{text-align:left}

/* ---------- record rows ---------- */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 150px 110px;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line);width:100%}
.row:hover{background:var(--surface-2)}
.row-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunken);color:var(--ink)}
@supports (background:color-mix(in srgb,red 10%,white)){
  .row-ico{background:color-mix(in srgb,var(--c,var(--ink-3)) 17%,var(--surface))}
}
.row-main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row-title{font-weight:600;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-meta{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.row-cat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.row-amt{text-align:right;font-weight:500;font-size:14px;white-space:nowrap}
.rows.compact .row{grid-template-columns:34px minmax(0,1fr) auto}
.rows.compact .row-cat{display:none}
.day-head{display:flex;justify-content:space-between;gap:12px;padding:9px 18px;background:var(--surface-2);border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-2)}
.day-head .num{font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .input{padding-left:34px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:0 4px 2px}
.cal-cell{position:relative;min-height:76px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:7px 8px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-cell.is-pad{border-color:transparent;background:transparent;min-height:0}
.cal-cell:not(.is-pad):hover{border-color:var(--line-2)}
.cal-cell.is-sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cal-num{font-size:12px;font-weight:700;color:var(--ink-2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin:-2px 0 0 -3px}
.cal-cell.is-today .cal-num{background:var(--ink);color:var(--surface)}
.cal-cell.is-future .cal-num{color:var(--ink-3);font-weight:500}

/* Says why a file wasn't saved; returns "format" when this view can't save that kind of file at all. */
function fileSaveFailed(e, kind) {
  const code = e && e.code;
  if (code === "declined") return "declined";
  if (code === "rate_limited") { toasts.push("A save prompt is already open. Answer that one first."); return "busy"; }
  if (code === "extension_not_enabled" || code === "rejected_extension") { toasts.push(kind + " files can't be saved in this view."); return "format"; }
  if (code === "too_large") { toasts.push("That file is too large to save here."); return "large"; }
  if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") { toasts.push("Saving files isn't available in this view."); return "off"; }
  toasts.push("Couldn't save the file. Try again.");
  return "error";
}

    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    try { window.scrollTo(0, 0); } catch (e) {}
  };
  async function saveNew(recs, onProgress) {
    const hadExamples = store.hasExamples();
    const failed = await store.putMany(recs, onProgress);
    const bad = new Set(failed.map(f => f.rec.id));
    const saved = recs.filter(r => !bad.has(r.id));
    if (!saved.length) throw (failed[0] && failed[0].error) || { code: "unavailable" };
    const tally = {}; saved.forEach(r => { const k = ymOf(r.date); tally[k] = (tally[k] || 0) + 1; });
    if (!tally[monthRef.current]) setMonth(Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0]);
    const what = saved.length === 1 ? "Saved " + fmtRM(cents(saved[0])) + " · " + (CAT[saved[0].cat] || CAT.other).label : "Saved " + saved.length + " records · " + fmtRM(sumCents(saved));
    if (hadExamples) {
      /* the made-up records go once the first real one is in; this runs after the save so the save feels instant */
      store.clearExamples().then(() => toasts.push("Example data cleared. From here on it's only your own records.")).catch(() => {});
    }
    toasts.push({
      text: what,
      action: { label: "Undo", run: () => {
        store.removeMany(saved).then(() => {
          const ids = Array.from(new Set(saved.map(r => r.img).filter(Boolean)));
          if (caps.assets) ids.forEach(id => { caps.assets.delete(id).catch(() => {}); });
          toasts.push(saved.length === 1 ? "Removed that record." : "Removed those " + saved.length + " records.");
        }).catch(() => toasts.push("Couldn't undo. Delete the records from the Records page."));
      } }
    });
    if (failed.length) toasts.push({ text: failed.length + (failed.length === 1 ? " record" : " records") + " couldn't be saved. " + saveErrorText(failed[0].error), ms: 9000 });
    return { saved: saved, failed: failed };
  }
  async function saveImport(ops, onProgress) {
    const hadExamples = store.hasExamples();
    const failed = await store.applyMany(ops, onProgress);
    const bad = new Set(failed.map(f => f.rec.id));
    const done = ops.filter(o => !bad.has(o.rec.id));
    if (!done.length) throw (failed[0] && failed[0].error) || { code: "unavailable" };
    const tally = {}; done.forEach(o => { const k = ymOf(o.rec.date); tally[k] = (tally[k] || 0) + 1; });
    if (!tally[monthRef.current]) setMonth(Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0]);
    if (hadExamples) store.clearExamples().then(() => toasts.push("Example data cleared. From here on it's only your own records.")).catch(() => {});
    const nNew = done.filter(o => !o.old).length, nUpd = done.length - nNew;
    const what = (nNew ? "Added " + nNew : "") + (nNew && nUpd ? ", updated " + nUpd : nUpd ? "Updated " + nUpd : "") + (done.length === 1 ? " record" : " records") + " · " + fmtRM(sumCents(done.map(o => o.rec)));
    toasts.push({ text: what, action: { label: "Undo", run: () => {
      store.undoMany(done).then(left => toasts.push(left && left.length ? left.length + (left.length === 1 ? " record" : " records") + " couldn't be put back. Check them on the Records page." : "Import undone."))
        .catch(() => toasts.push("Couldn't undo the import. Check the records on the Records page."));
    } } });
    if (failed.length) toasts.push({ text: failed.length + (failed.length === 1 ? " row" : " rows") + " couldn't be saved. " + saveErrorText(failed[0].error), ms: 9000 });
    return { done: done, failed: failed };
  }
  async function exportMonth(ym) {
    const recs = store.recs(ym).filter(r => !r.example).sort((a, b) => -cmpDesc(a, b));
    if (!recs.length) { toasts.push("There's nothing of yours to export for " + monthLabel(ym) + " yet."); return; }
    const base = "Ringgit Log " + ym;
    if (!caps.downloads) { setText({ title: "Export " + monthLabel(ym), text: toCsv(recs), hint: "Saving files isn't available in this view. Copy the text into a spreadsheet; it can be imported back the same way." }); return; }
    let blob = null;
    try { blob = await buildXlsx(recs); } catch (e) { blob = null; }
    const name = blob ? base + ".xlsx" : base + ".csv";
    try { await caps.downloads.save({ filename: name, data: blob || toCsv(recs) }); toasts.push("Saved " + name + ". Edit it and import it back to update these records."); }
    catch (e) {
      if (fileSaveFailed(e, blob ? "Excel" : "CSV") === "format" || (e && e.code === "unavailable"))
        setText({ title: "Export " + monthLabel(ym), text: toCsv(recs), hint: "Copy the text into a spreadsheet instead; it can be imported back the same way." });
    }
  }
  const A = {
    today: today, month: month, go: go, setMonth: setMonth, saveNew: saveNew, saveImport: saveImport, exportMonth: exportMonth,
    openImport: () => setImp(true),
    showMissing: () => { setRecMissing(true); setRecFilter([]); go("records"); },
    openAdd: preset => setWiz(preset || {}),
    openRec: r => setEdit(r),
    showText: setText,
    pickDay: date => { setMonth(ymOf(date)); setSelDay(date); go("calendar"); },
    planTrip: kind => { go("trips"); setHint({ kind: kind, n: Date.now() }); }
  };
  async function clearExamples() {
    setClearing(true);
    try { await store.clearExamples(); toasts.push("Example data cleared."); } catch (e) { toasts.push("Couldn't clear the examples. Try again."); }
    setClearing(false);
  }

  const cur = PAGES.find(x => x.id === page) || PAGES[0];
  const mode = store.mode(), isCurMonth = month === ymOf(today), scoped = page !== "settings";
  let view = null;
  if (page === "overview") view = h(Overview, { A: A, month: month });
  else if (page === "records") view = h(RecordsPage, { A: A, month: month, filter: recFilter, setFilter: setRecFilter, missingOnly: recMissing, setMissingOnly: setRecMissing });
  else if (page === "calendar") view = h(CalendarPage, { A: A, month: month, filter: calFilter, setFilter: setCalFilter, selDay: selDay, setSelDay: setSelDay });
  else if (page === "trips") view = h(TripsPage, { A: A, month: month, hint: hint });
  else if (page === "parking") view = h(ParkingPage, { A: A, month: month });
  else view = h(SettingsPage, { A: A, theme: theme, setTheme: setTheme });

  const syncText = mode === "cloud" ? "Saved to your account. Private to you." : mode === "local" ? "Saved in this browser only." : "Connecting to your storage…";
  const monthErr = scoped ? store.errorOf(month) : "";

  return h("div", { className: "app" },
    h("aside", { className: "rail" },
      h("div", { className: "brand" }, h(BrandMark), "Ringgit Log"),
      h("nav", { className: "nav", "aria-label": "Sections" }, PAGES.map(x =>
        h("button", { key: x.id, type: "button", className: cx("nav-item", page === x.id && "is-active"), "aria-current": page === x.id ? "page" : undefined, onClick: () => go(x.id) }, h(Icon, { name: x.icon }), x.label))),
      h("div", { className: "rail-foot" },
        PLATFORM.ui.RailAccount && mode !== "local" ? h(PLATFORM.ui.RailAccount)
          : h("div", { className: cx("sync", mode === "cloud" && "is-cloud", mode === "local" && "is-local") }, h("span", { className: "sync-dot" }), h("span", null, syncText)),
        h(Seg, { label: "Theme", value: theme, onChange: setTheme, options: [{ id: "light", label: "Light", icon: "sun" }, { id: "dark", label: "Dark", icon: "moon" }] }))),
    h("div", { className: "main" },
      h("header", { className: "top" },
        h("div", { className: "top-title" }, h("div", { className: "eyebrow" }, scoped ? monthLabel(month) : "Ringgit Log"), h("h1", null, cur.label)),
        h("div", { className: "top-actions" },
          scoped && !isCurMonth ? h("button", { type: "button", className: "btn ghost sm", onClick: () => setMonth(ymOf(today)) }, "This month") : null,
          scoped ? h(MonthSwitch, { value: month, onChange: setMonth }) : null,
          h("button", { type: "button", className: "btn primary add-desktop", onClick: () => A.openAdd() }, h(Icon, { name: "plus", size: 16 }), "Add expense"),
          h("button", { type: "button", className: "icon-btn only-mobile", "aria-label": "Settings", onClick: () => go("settings") }, h(Icon, { name: "sliders" })))),
      h("main", { className: "content" },
        store.hasExamples() ? h("div", { className: "banner", role: "note" }, h(Icon, { name: "info", size: 16 }),
          h("span", { className: "grow" }, h("strong", null, "You're looking at example data."), " These records are made up to show how the app works. They clear themselves when you save your first record."),
          h("button", { type: "button", className: "btn sm", disabled: clearing, onClick: clearExamples }, clearing ? "Clearing…" : "Clear examples")) : null,
        mode === "local" && page === "overview" ? h("div", { className: "banner warn", role: "note" }, h(Icon, { name: "info", size: 16 }),
          h("span", { className: "grow" }, "Records are being saved in this browser only, so they won't show up on your other devices.")) : null,
        monthErr ? h("div", { className: "banner bad", role: "alert" }, h(Icon, { name: "alert", size: 16 }),
          h("span", { className: "grow" }, monthErr === "revoked" ? "Access to your storage was withdrawn while the page was open. Reload the page." : "Records for " + monthLabel(month) + " couldn't be loaded."),
          monthErr === "revoked" ? null : h("button", { type: "button", className: "btn sm", onClick: () => store.retry() }, "Try again")) : null,
        view)),
    h("nav", { className: "tabbar", "aria-label": "Sections" }, PAGES.filter(x => x.tab).map(x =>
      h("button", { key: x.id, type: "button", className: cx("tab", page === x.id && "is-active"), "aria-current": page === x.id ? "page" : undefined, onClick: () => go(x.id) }, h(Icon, { name: x.icon, size: 20 }), x.tab))),
    h("button", { type: "button", className: "fab", "aria-label": "Add expense", onClick: () => A.openAdd() }, h(Icon, { name: "plus", size: 24, sw: 2.2 })),
    wiz ? h(Wizard, { A: A, preset: wiz, onClose: () => setWiz(null) }) : null,
    edit ? h(RecordModal, { key: edit.id, rec: edit, onClose: () => setEdit(null) }) : null,
    text ? h(CopyModal, { title: text.title, text: text.text, hint: text.hint, onClose: () => setText(null) }) : null,
    imp ? h(ImportModal, { A: A, onClose: () => setImp(false) }) : null,
    h(Toasts));
}

startApp();

})();
</script>
</body>
</html>
